name: portfolio-chatbot

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Jerusalem
      TZ: Asia/Jerusalem
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "24"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workspace/workflows:ro
      - ./knowledge:/workspace/knowledge:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  portfolio-gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    environment:
      PORT: "8080"
      N8N_CHAT_URL: ${N8N_CHAT_URL}
      N8N_HEALTH_URL: ${N8N_HEALTH_URL}
      OLLAMA_HEALTH_URL: ${OLLAMA_HEALTH_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      n8n:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  ngrok:
    image: ngrok/ngrok:3
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - http
      - --domain=${NGROK_DOMAIN}
      - portfolio-gateway:8080
    depends_on:
      portfolio-gateway:
        condition: service_healthy

volumes:
  n8n_data:
